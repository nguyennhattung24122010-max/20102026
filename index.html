<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Nhật Ký Lời Chúc · 20.10 Special</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #0b0711;
      --bg-glow: #2c1227;
      --gold: #f3d29c;
      --rose: #ff8fa3;
      --rose-dark: #c9184a;
      --glass-bg: rgba(255, 255, 255, 0.055);
      --glass-border: rgba(243, 210, 156, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at 50% 20%, var(--bg-glow) 0%, var(--bg-deep) 80%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
      padding: 18px;
    }

    #bgCanvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* Nút nhạc */
    .music-btn {
      position: fixed;
      top: 20px; right: 20px;
      z-index: 10;
      width: 44px; height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      color: var(--gold);
      font-size: 18px;
      transition: all 0.3s ease;
    }

    .music-btn.playing {
      animation: spinSlow 6s linear infinite;
      border-color: var(--rose);
      box-shadow: 0 0 15px rgba(255, 143, 163, 0.45);
    }

    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Khung Sổ Lưu Niệm */
    .book-card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 430px;
      background: var(--glass-bg);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      padding: 36px 26px 30px;
      text-align: center;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.65), inset 0 1px 1px rgba(255, 255, 255, 0.15);
    }

    .tag-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--gold);
      background: rgba(243, 210, 156, 0.1);
      border: 1px solid rgba(243, 210, 156, 0.3);
      padding: 6px 14px;
      border-radius: 99px;
      margin-bottom: 20px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 32px;
      font-weight: 500;
      line-height: 1.25;
      color: #fff;
      margin-bottom: 12px;
    }

    h1 i {
      color: var(--rose);
      font-weight: 600;
      display: block;
      margin-top: 4px;
    }

    .subtitle {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.68);
      line-height: 1.6;
      margin-bottom: 26px;
    }

    input {
      width: 100%;
      padding: 16px 20px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(0, 0, 0, 0.35);
      color: #fff;
      font-family: inherit;
      font-size: 15px;
      text-align: center;
      outline: none;
      margin-bottom: 16px;
      transition: all 0.3s ease;
    }

    input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 18px rgba(243, 210, 156, 0.2);
    }

    .btn-primary {
      width: 100%;
      padding: 15px 22px;
      border-radius: 16px;
      border: none;
      background: linear-gradient(135deg, #ff758f 0%, #c9184a 55%, #800f2f 100%);
      color: #fff;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(201, 24, 74, 0.4);
      transition: all 0.25s ease;
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    /* MÀN HÌNH LẬT TRANG */
    #storyScreen {
      display: none;
    }

    .story-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding: 0 4px;
    }

    .recipient-label {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      color: var(--gold);
    }

    .page-counter {
      font-size: 12px;
      font-weight: 600;
      color: var(--rose);
      background: rgba(255, 143, 163, 0.12);
      border: 1px solid rgba(255, 143, 163, 0.3);
      padding: 4px 12px;
      border-radius: 99px;
    }

    /* Khung Trang Sách */
    .page-box {
      min-height: 230px;
      background: linear-gradient(160deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 143, 163, 0.04) 100%);
      border: 1px solid rgba(243, 210, 156, 0.28);
      border-radius: 22px;
      padding: 26px 22px 20px;
      text-align: left;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.25);
    }

    .page-FlipAnim {
      animation: pageFlip 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes pageFlip {
      0% { opacity: 0; transform: translateX(22px) rotateY(-8deg) scale(0.97); }
      100% { opacity: 1; transform: translateX(0) rotateY(0) scale(1); }
    }

    .page-chapter {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 14px;
    }

    .page-content {
      font-size: 15.5px;
      line-height: 1.78;
      color: #fff5f7;
      margin-bottom: 16px;
    }

    .page-quote {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 13.5px;
      color: rgba(243, 210, 156, 0.85);
      border-top: 1px dashed rgba(255, 255, 255, 0.14);
      padding-top: 12px;
      text-align: right;
    }

    /* Chấm tròn tiến trình */
    .dots-bar {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 18px 0;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.2);
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .dot.active {
      width: 26px;
      background: var(--rose);
      box-shadow: 0 0 10px rgba(255, 143, 163, 0.6);
    }

    /* Thanh nút điều hướng Trang Trước / Trang Tiếp */
    .nav-controls {
      display: flex;
      gap: 10px;
    }

    .btn-nav {
      flex: 1;
      padding: 13px 16px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.07);
      color: #fff;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-nav:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .btn-nav.next-highlight {
      background: linear-gradient(135deg, #ff758f 0%, #c9184a 100%);
      border: none;
      box-shadow: 0 6px 18px rgba(201, 24, 74, 0.35);
    }

    .bottom-links {
      margin-top: 14px;
      display: flex;
      justify-content: space-between;
      font-size: 12.5px;
    }

    .link-action {
      color: rgba(255, 255, 255, 0.6);
      background: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      text-decoration: underline;
      padding: 4px;
    }

    .link-action:hover {
      color: var(--gold);
    }
  </style>
</head>
<body>

  <canvas id="bgCanvas"></canvas>

  <button class="music-btn" id="musicBtn" title="Bật / Tắt giai điệu" onclick="toggleMusic()">♪</button>

  <div class="book-card">
    <div class="tag-pill">✦ STORYBOOK · 20.10 EDITION ✦</div>

    <!-- MÀN HÌNH 1: NHẬP TÊN -->
    <div id="welcomeScreen">
      <h1>Cuốn sổ nhỏ<br><i>dành tặng riêng bạn</i></h1>
      <p class="subtitle">Nhập tên của bạn để mở ra 4 trang thông điệp bí mật được ghép ngẫu nhiên dành riêng cho bạn hôm nay.</p>

      <input type="text" id="userName" placeholder="Nhập tên của bạn..." autocomplete="off" />
      <button class="btn-primary" onclick="openStoryBook()">Mở trang đầu tiên 📖</button>
    </div>

    <!-- MÀN HÌNH 2: ĐỌC TỪNG TRANG -->
    <div id="storyScreen">
      <div class="story-top">
        <div class="recipient-label">Gửi <span id="displayReceiver"></span>,</div>
        <div class="page-counter" id="pageIndicator">Trang 1 / 4</div>
      </div>

      <!-- Nội dung trang sách (hỗ trợ vuốt ngang trên điện thoại) -->
      <div class="page-box" id="pageBox">
        <div>
          <div class="page-chapter" id="chapterTitle"></div>
          <div class="page-content" id="chapterBody"></div>
        </div>
        <div class="page-quote" id="chapterQuote"></div>
      </div>

      <!-- Chấm chỉ báo trang -->
      <div class="dots-bar" id="dotsContainer"></div>

      <!-- Nút chuyển trang -->
      <div class="nav-controls">
        <button class="btn-nav" id="prevBtn" onclick="changePage(-1)">← Trang trước</button>
        <button class="btn-nav next-highlight" id="nextBtn" onclick="changePage(1)">Trang tiếp →</button>
      </div>

      <div class="bottom-links">
        <button class="link-action" onclick="regenerateBook()">🎲 Đổi 4 trang ngẫu nhiên khác</button>
        <button class="link-action" onclick="resetToHome()">Đổi tên người nhận</button>
      </div>
    </div>
  </div>

  <script>
    // =====================================================
    // KHO DỮ LIỆU ĐA TẦNG: MỖI TRANG CÓ NHIỀU PHIÊN BẢN NGẪU NHIÊN
    // =====================================================
    const pagePools = [
      // TRANG 1: LỜI MỞ ĐẦU
      {
        chapter: "🌸 Trang 1 · Lời Chào Tháng Mười",
        quotes: ["“Mỗi cô gái đều là một bản nhạc dịu dàng của thế gian.”", "“Hôm nay là ngày bầu trời dịu lại để tôn vinh bạn.”"],
        messages: [
          "Chào {name}, giữa hàng triệu điều tình cờ, thật vui vì bạn đã mở cuốn sổ nhỏ này. Chúc {name} có một ngày 20/10 mở đầu bằng thật nhiều niềm vui và sự ấm áp!",
          "Tháng Mười về mang theo những cơn gió dịu dàng nhất, cũng giống như sự hiện diện của {name} vậy. Chúc bạn một ngày Phụ nữ Việt Nam ngập tràn tiếng cười!",
          "Cuốn sổ nhỏ này được mở ra chỉ để nhắc {name} rằng: Hôm nay là một ngày vô cùng đặc biệt, và bạn xứng đáng nhận được tất cả những lời chúc ngọt ngào nhất."
        ]
      },
      // TRANG 2: VẺ ĐẸP & NỤ CƯỜI
      {
        chapter: "✨ Trang 2 · Nụ Cười & Sự Rạng Rỡ",
        quotes: ["“Nụ cười của bạn chính là trang sức lấp lánh nhất.”", "“Hãy luôn tỏa sáng theo cách riêng biệt nhất.”"],
        messages: [
          "Mong {name} luôn giữ được ánh mắt trong veo và nụ cười tỏa nắng. Dù cuộc sống có bận rộn thế nào, hãy luôn dành thời gian yêu chiều và chăm sóc bản thân thật tốt nhé!",
          "Chúc {name} tuổi mới, ngày mới lúc nào cũng xinh đẹp rạng ngời. Không cần phải giống bất kỳ ai, vì khi là chính mình, {name} đã là phiên bản cuốn hút nhất rồi.",
          "Gửi tới {name} một nhành hoa của sự trẻ trung và lạc quan. Mong rằng mỗi khi bạn soi gương đều thấy một cô gái tự tin, rạng rỡ và tràn đầy sức sống!"
        ]
      },
      // TRANG 3: ƯỚC MƠ & HÀNH TRÌNH
      {
        chapter: "💎 Trang 3 · Bản Lĩnh & Ước Mơ",
        quotes: ["“Mềm mại như nước nhưng kiên cường như kim cương.”", "“Mọi hạt giống nỗ lực đều sẽ nở hoa đúng mùa.”"],
        messages: [
          "Trên chặng đường sắp tới, chúc {name} luôn chân cứng đá mềm. Mong mọi dự định, kế hoạch hay ước mơ mà {name} đang ấp ủ đều sẽ thuận buồm xuôi gió và gặt hái quả ngọt!",
          "Chúc {name} vừa có đủ sự dịu dàng để cảm nhận hạnh phúc, vừa có đủ sự kiên cường để bước qua mọi thử thách. Thành công và may mắn chắc chắn sẽ luôn mỉm cười với bạn.",
          "Dù ở giảng đường hay trong công việc, chúc {name} luôn giữ vững ngọn lửa nhiệt huyết. Hãy cứ tự tin sải bước vì phía trước bạn là cả một bầu trời rộng mở!"
        ]
      },
      // TRANG 4: LỜI KẾT NGỌT NGÀO
      {
        chapter: "💌 Trang Cuối · Lời Chúc 365 Ngày",
        quotes: ["“Happy Vietnamese Women's Day · 20.10”", "“Bình yên ở trong tâm, hạnh phúc ở ngay cạnh.”"],
        messages: [
          "Khép lại trang sổ nhỏ này, chúc {name} không chỉ riêng ngày 20/10 mà suốt 365 ngày trong năm đều được yêu thương, trân trọng và sống giữa những điều tử tế nhất!",
          "Món quà tinh thần nhỏ bé này xin gửi trọn vẹn may mắn đến {name}. Chúc bạn tối nay ngủ thật ngon, ngày mai thức dậy với thật nhiều năng lượng tích cực nhé!",
          "Trang cuối cùng xin dành để chúc {name} hai chữ: Bình Yên và Trọn Vẹn. Cảm ơn {name} vì đã đọc hết những dòng chữ này. Chúc bạn một mùa 20/10 thật đáng nhớ!"
        ]
      }
    ];

    let currentName = "";
    let currentBookPages = [];
    let currentPageIndex = 0;

    function pickRandomItem(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    // Tạo ra bộ 4 trang ngẫu nhiên cho người nhận
    function buildBookForUser(name) {
      return pagePools.map(pool => ({
        chapter: pool.chapter,
        body: pickRandomItem(pool.messages).replace(/{name}/g, name),
        quote: pickRandomItem(pool.quotes)
      }));
    }

    function openStoryBook() {
      const input = document.getElementById("userName");
      const val = input.value.trim();
      if (!val) {
        input.style.borderColor = "#ff4d6d";
        input.focus();
        return;
      }

      currentName = val;
      document.getElementById("displayReceiver").textContent = currentName;

      currentBookPages = buildBookForUser(currentName);
      currentPageIndex = 0;

      document.getElementById("welcomeScreen").style.display = "none";
      document.getElementById("storyScreen").style.display = "block";

      renderDots();
      updatePageView();
      burstSparkles();

      if (!isMusicPlaying) startMusicBox();
    }

    function renderDots() {
      const container = document.getElementById("dotsContainer");
      container.innerHTML = "";
      currentBookPages.forEach((_, idx) => {
        const dot = document.createElement("div");
        dot.className = "dot" + (idx === currentPageIndex ? " active" : "");
        dot.onclick = () => goToPage(idx);
        container.appendChild(dot);
      });
    }

    function updatePageView() {
      const pageData = currentBookPages[currentPageIndex];
      const box = document.getElementById("pageBox");

      // Kích hoạt hiệu ứng lật trang
      box.classList.remove("page-FlipAnim");
      void box.offsetWidth;
      box.classList.add("page-FlipAnim");

      document.getElementById("pageIndicator").textContent = `Trang ${currentPageIndex + 1} / ${currentBookPages.length}`;
      document.getElementById("chapterTitle").textContent = pageData.chapter;
      document.getElementById("chapterBody").textContent = pageData.body;
      document.getElementById("chapterQuote").textContent = pageData.quote;

      // Cập nhật chấm tròn
      const dots = document.querySelectorAll(".dot");
      dots.forEach((d, idx) => d.classList.toggle("active", idx === currentPageIndex));

      // Cập nhật trạng thái nút bấm
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");

      prevBtn.disabled = currentPageIndex === 0;

      if (currentPageIndex === currentBookPages.length - 1) {
        nextBtn.textContent = "Đọc lại từ đầu ↺";
      } else {
        nextBtn.textContent = "Trang tiếp →";
      }
    }

    function changePage(step) {
      if (currentPageIndex === currentBookPages.length - 1 && step === 1) {
        currentPageIndex = 0;
      } else {
        currentPageIndex = Math.max(0, Math.min(currentBookPages.length - 1, currentPageIndex + step));
      }
      updatePageView();
      burstSparkles();
    }

    function goToPage(index) {
      currentPageIndex = index;
      updatePageView();
    }

    function regenerateBook() {
      currentBookPages = buildBookForUser(currentName);
      currentPageIndex = 0;
      updatePageView();
      burstSparkles();
    }

    function resetToHome() {
      document.getElementById("userName").value = "";
      document.getElementById("storyScreen").style.display = "none";
      document.getElementById("welcomeScreen").style.display = "block";
    }

    document.getElementById("userName").addEventListener("keypress", (e) => {
      if (e.key === "Enter") openStoryBook();
    });

    // Hỗ trợ thao tác vuốt ngang (Swipe) trên điện thoại để lật trang
    let touchStartX = 0;
    const pageBoxEl = document.getElementById("pageBox");
    pageBoxEl.addEventListener("touchstart", (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    pageBoxEl.addEventListener("touchend", (e) => {
      const diff = touchStartX - e.changedTouches[0].screenX;
      if (Math.abs(diff) > 45) {
        if (diff > 0 && currentPageIndex < currentBookPages.length - 1) {
          changePage(1); // Vuốt sang trái -> Trang tiếp
        } else if (diff < 0 && currentPageIndex > 0) {
          changePage(-1); // Vuốt sang phải -> Trang trước
        }
      }
    }, { passive: true });

    // =====================================================
    // HỘP NHẠC PIANO TỰ ĐỘNG
    // =====================================================
    let audioCtx = null;
    let isMusicPlaying = false;
    let melodyInterval = null;
    const melodyNotes = [523.25, 659.25, 783.99, 1046.50, 783.99, 659.25, 587.33, 698.46, 880.00, 698.46, 587.33, 493.88, 659.25, 783.99];
    let noteCursor = 0;

    function playSingleNote(freq) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.08, audioCtx.currentTime + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.4);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 1.4);
    }

    function startMusicBox() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      isMusicPlaying = true;
      document.getElementById("musicBtn").classList.add("playing");
      playSingleNote(melodyNotes[noteCursor]);
      melodyInterval = setInterval(() => {
        noteCursor = (noteCursor + 1) % melodyNotes.length;
        playSingleNote(melodyNotes[noteCursor]);
      }, 650);
    }

    function toggleMusic() {
      if (isMusicPlaying) {
        isMusicPlaying = false;
        clearInterval(melodyInterval);
        document.getElementById("musicBtn").classList.remove("playing");
      } else {
        startMusicBox();
      }
    }

    // =====================================================
    // HIỆU ỨNG CÁNH HOA & PHÁO SÁNG CANVAS
    // =====================================================
    const canvas = document.getElementById("bgCanvas");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    const petals = Array.from({ length: 35 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      size: Math.random() * 4 + 2,
      speedY: Math.random() * 0.6 + 0.25,
      speedX: (Math.random() - 0.5) * 0.5,
      angle: Math.random() * Math.PI * 2,
      spin: (Math.random() - 0.5) * 0.02,
      color: Math.random() > 0.4 ? "rgba(255, 143, 163, 0.55)" : "rgba(243, 210, 156, 0.5)"
    }));

    let sparkles = [];

    function burstSparkles() {
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      for (let i = 0; i < 24; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 3.8 + 1.2;
        sparkles.push({
          x: cx, y: cy,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          r: Math.random() * 2.5 + 1,
          alpha: 1,
          color: i % 2 === 0 ? "#f3d29c" : "#ff8fa3"
        });
      }
    }

    function renderCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      petals.forEach(p => {
        p.y += p.speedY;
        p.x += p.speedX + Math.sin(p.angle) * 0.3;
        p.angle += p.spin;
        if (p.y > canvas.height + 10) { p.y = -10; p.x = Math.random() * canvas.width; }
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.ellipse(0, 0, p.size, p.size * 0.6, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      for (let i = sparkles.length - 1; i >= 0; i--) {
        const s = sparkles[i];
        s.x += s.vx; s.y += s.vy; s.alpha -= 0.022;
        if (s.alpha <= 0) { sparkles.splice(i, 1); continue; }
        ctx.save();
        ctx.globalAlpha = s.alpha;
        ctx.fillStyle = s.color;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      requestAnimationFrame(renderCanvas);
    }
    renderCanvas();
  </script>
</body>
</html>
